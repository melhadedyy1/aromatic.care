<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AROMATIC CARE | رعاية العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--b:#17448f;--bg:#f4f6fa;--c:#fff;--t:#1a2233;--m:#667085;--l:#dbe2ee;--ok:#16794a;--no:#b42318;--wa:#9a6700;--bt:#17448f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1521;--c:#172033;--t:#e8ecf5;--m:#9aa5bb;--l:#2a3550;--bt:#2f63c4;--ok:#4cc38a;--no:#f97066;--wa:#e5b34a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Tajawal,Tahoma,sans-serif}
header{background:#17448f;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{width:46px;height:46px;border-radius:8px}header b{font-size:18px;display:block;line-height:1.2}header small{opacity:.8}header button{margin-inline-start:auto;background:none;border:1px solid #fff7;color:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
nav{display:flex;background:var(--c);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:13px 4px;border:0;background:none;color:var(--m);font:500 15px Tajawal,sans-serif;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--bt);border-color:var(--bt);font-weight:700}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:14px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
textarea{min-height:70px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 14px;border:1px solid var(--l);border-radius:20px;background:var(--bg);color:var(--t);cursor:pointer;font:inherit}
.chip.on{background:var(--bt);color:#fff;border-color:var(--bt)}
.btn{padding:13px;border:0;border-radius:10px;background:var(--bt);color:#fff;font:700 16px Tajawal,sans-serif;cursor:pointer;width:100%}.btn:disabled{opacity:.6}
.btn.s{background:var(--bg);color:var(--t);border:1px solid var(--l)}.row{display:flex;gap:10px;margin-top:12px}
.up{border:1px dashed var(--m);border-radius:10px;height:130px;display:flex;align-items:center;justify-content:center;color:var(--m);cursor:pointer;overflow:hidden;text-align:center;font-size:14px}.up img{width:100%;height:100%;object-fit:contain}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;background:var(--bg);border:1px solid var(--l)}
.yes{color:var(--ok)}.no{color:var(--no)}.pending{color:var(--wa)}.err{color:var(--no)}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.it small{color:var(--m)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.st div b{font-size:28px;display:block;color:var(--bt)}
.bar{height:8px;background:var(--bg);border-radius:4px;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--bt);border-radius:4px}
.dd{position:absolute;inset-inline:0;top:100%;background:var(--c);border:1px solid var(--l);border-radius:8px;max-height:240px;overflow:auto;z-index:9;display:none}.dd div{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--l)}.dd div:hover{background:var(--bg)}
.login{max-width:380px;margin:40px auto}
#report{display:none}
@media print{body>*:not(#report){display:none!important}#report{display:block;color:#000;background:#fff}@page{size:A4;margin:10mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.rh{background:#17448f;color:#fff;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:6px}.rh img{width:62px;height:62px;border-radius:6px}.rh b{font-size:20px;display:block}
.rm{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #ccc;font-size:14px}
.rs{margin-top:12px}.rs h3{font-size:15px;color:#17448f;border-bottom:2px solid #17448f;margin:0 0 6px;padding-bottom:3px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:14px}.rg span{color:#555;font-size:12px;display:block}
.ri{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.ri div{border:1px solid #ccc;height:62mm;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;border-radius:4px}.ri img{max-width:100%;max-height:100%}
.rf{margin-top:14px;text-align:center;font-size:12px;color:#666;border-top:1px solid #ccc;padding-top:6px}
</style></head><body>

<script>
const API='__API__';
const BR=[["101002", "RIY-01-AlSahafa"], ["101003", "RIY-01-Al-Rawabi"], ["101004", "RIY-01-Al-Malqa"], ["101005", "RIY-01-Al-Suwaidi"], ["101006", "RIY-01-Park-Avenue"], ["101007", "RIY-01-WadiLaban"], ["101008", "RIY-01-Al Jazeera"], ["101009", "RIY-01-Al-Quds"], ["101010", "RIY-01-ALShifa"], ["101011", "RIY-01-RIYADH-PARK"], ["101012", "RIY-01-RIYADH-GALLERY"], ["101013", "RIY-01-Al-Kharj"], ["101014", "AHS-01-Al-Ahsa-Mall"], ["101015", "AHS-01-Al-Bustan"], ["101016", "KHO-01-GreenBelt"], ["101017", "DAM-01-Al Mazruiyah"], ["101018", "Qas-01-Unayzah"], ["101019", "QAS-01-Buraydah"], ["101020", "JED-01-Jeddah-Park"], ["101021", "JED-01-AL TAHLIA"], ["101022", "MAC-01-Al-AWALI"], ["101023", "TAI-01-ZPARK Taif"], ["101024", "ASE-01-Muhayil"], ["101025", "MAC-01-Ash-Sharaei"], ["101026", "YAN-01-Yanbu"], ["101027", "QAS-01-Ar-Rass"], ["101028", "JIZ-01-Samtah"], ["101029", "JIZ-01-Jazan"], ["101030", "BAH-01-Al-Baha"], ["101031", "NAJ-01-Malgron Najran"], ["101032", "TAB-01-Tabuk"], ["101033", "MAC-01-AlQunfuda"], ["101034", "JED-01-Quraish"], ["101035", "ASE-01-KhamisMushait"], ["101036", "JED-01-AlAmirFawwaz"], ["101037", "MAD-01-AlUsayfirin"], ["101038", "MAD-01-Sari"], ["101039", "JAW-01-Sakakah"], ["101040", "AlU-01-Arar"], ["101041", "HaI-01-Hail"], ["101042", "Haf-01-HafarAlBatin"], ["101043", "JUB-01-PianoMall"], ["101044", "DAM-01-NourMall"], ["101045", "MAD-01-Bukhari"], ["101046", "ASIR-01-SABIA"], ["101047", "KHO-01-Alrashid Mall"], ["101048", "KHO-01-AMWAJ MALL"], ["101049", "TAB-01-Tabuk PARK"], ["101051", "TAI-01-Taif Shahar St"], ["101052", "RIY-01-Othaim Mall-Kharis"], ["101054", "KAH-01-Othaim Mall-Khafji"], ["101055", "MAC-01-Al-HARAM"], ["101057", "TAI-01-Tera Mall‎ Taif"], ["101050", "NAJ-01-Earisuh"], ["101056", "RIY-01-Othaim Granada"], ["101058", "QAS-01-Buraidah  Jarir"], ["101059", "DAM-01-C Front"], ["101060", "JED-01-Al Yassmin"], ["101061", "JED-01-Al Hamdanya"], ["101062", "MAD-01-ELNour-Medina"], ["101064", "AHS-01-Al-Othaim Al Ahsa"], ["101065", "JIZ-01-Alrashid-Jazan"], ["101066", "RIY-01-Jarir Bookstore"], ["101067", "JED-01-Obhur Plaza"], ["101068", "AJF-01-Al Qurayyat"], ["101069", "DAM-01-Othaim Mall DMM"], ["101070", "NAJ-01-Hesn plaza"], ["101071", "HaI-01-Hail Barzan"], ["101072", "MAC-01-Al Shawqiyah"]];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CP={'عطور':['تغير الرائحة','ضعف الثبات','ضعف الفوحان','تغير اللون','تسريب أو مشكلة بالعبوة','أخرى'],'زيوت عطرية':['تغير الرائحة','ضعف الانتشار','تغير اللون','مشكلة في الاستخدام بالجهاز','تسريب','أخرى']};
const DEC={pending:'قيد الفحص',yes:'يستحق الاستبدال',no:'لا يستحق الاستبدال'};
const today=()=>new Date().toISOString().slice(0,10),fd=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const norm=s=>String(s).toLowerCase().replace(/[\s\-_]/g,'');
const status=i=>i.dec==='pending'?'قيد الفحص':(i.done==='تم الاستبدال'||i.dec==='no')?'تم إغلاق الشكوى':'تم اتخاذ القرار';
const imgSrc=v=>!v?'':v.startsWith('data:')?v:'https://drive.google.com/thumbnail?id='+v+'&sz=w900';
const blank=()=>({no:'',bc:'',bn:'',name:'',phone:'',type:'عطور',product:'',buy:'',recv:today(),comps:[],desc:'',img1:'',img2:'',finding:'',dec:'pending',reason:'',done:'',cons:'',decDate:''});
let PASS=sessionStorage.getItem('p')||'',ROLE=sessionStorage.getItem('r')||'',cur=blank(),view='form',q='',ALL=null,busy=false;
async function api(b){const r=await fetch(API,{method:'POST',body:JSON.stringify({...b,pass:PASS})});return r.json()}
function boot(){$('#out').hidden=!ROLE;const n=$('#nav');n.hidden=ROLE!=='admin';
n.innerHTML=ROLE==='admin'?[['form','شكوى جديدة'],['log','سجل الشكاوى'],['stats','الإحصائيات']].map(([v,t])=>`<button data-v="${v}" class="${v===view?'on':''}">${t}</button>`).join(''):'';draw()}
$('#nav').onclick=e=>{const v=e.target.dataset.v;if(v){if(v==='form')cur=blank();go(v)}};
$('#out').onclick=()=>{sessionStorage.clear();PASS=ROLE='';ALL=null;view='form';cur=blank();boot()};
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));draw()}
function draw(){const a=$('#app');if(!API.startsWith('http')){a.innerHTML='<div class="card err">لم يتم ربط الموقع بالخادم بعد. ضع رابط Web App في المتغير API.</div>';return}
if(!ROLE){a.innerHTML=`<div class="card login"><h2>تسجيل الدخول</h2><label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password"><p id="le" class="err"></p><button class="btn" id="lb">دخول</button></div>`;$('#lb').onclick=login;$('#pw').onkeydown=e=>e.key==='Enter'&&login();return}
if(view==='form'){a.innerHTML=form();bind()}else if(view==='log'){a.innerHTML=log();loadAll()}else if(view==='stats'){a.innerHTML=stats();loadAll()}else if(view==='done'){a.innerHTML=`<div class="card"><h2>تم إرسال البلاغ</h2><p>رقم التقرير: <b>${cur.no}</b></p><div class="row"><button class="btn" id="pp">إصدار تقرير PDF</button><button class="btn s" id="nn">بلاغ جديد</button></div></div>`;$('#pp').onclick=()=>printRep(cur);$('#nn').onclick=()=>{cur=blank();go('form')}}}
async function login(){const p=$('#pw').value;if(!p)return;$('#lb').disabled=true;$('#le').textContent='';PASS=p;try{const r=await api({action:'login'});if(r.ok){ROLE=r.role;sessionStorage.setItem('p',p);sessionStorage.setItem('r',ROLE);boot()}else{PASS='';$('#le').textContent='كلمة السر غير صحيحة';$('#lb').disabled=false}}catch(e){PASS='';$('#le').textContent='تعذر الاتصال بالخادم. تحقق من الإنترنت.';$('#lb').disabled=false}}
function form(){const c=cur,adm=ROLE==='admin';
return`<div class="card"><div class="it"><h2>${c.no?'تعديل بلاغ':'بلاغ جديد'}</h2>${c.no?`<span class="tag">${c.no}</span>`:''}</div>
<label>الفرع</label><div style="position:relative"><input id="bs" autocomplete="off" placeholder="ابحث باسم الفرع أو كوده" value="${esc(c.bn?c.bc+' · '+c.bn:'')}"><div class="dd" id="bl"></div></div>
<div class="g2"><div><label>اسم العميل</label><input data-k="name" value="${esc(c.name)}"></div><div><label>رقم الجوال</label><input data-k="phone" inputmode="tel" dir="ltr" style="text-align:right" placeholder="05XXXXXXXX" value="${esc(c.phone)}"></div></div></div>
<div class="card"><h2>المنتج</h2><div class="chips">${Object.keys(CP).map(t=>`<button type="button" class="chip ${c.type===t?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
<div class="g2"><div><label>اسم المنتج</label><input data-k="product" value="${esc(c.product)}"></div><div><label>تاريخ الشراء (إن وُجد)</label><input type="date" data-k="buy" value="${String(c.buy).slice(0,10)}"></div></div>
<label>تاريخ استلام المنتج للفحص</label><input type="date" data-k="recv" value="${String(c.recv).slice(0,10)}"></div>
<div class="card"><h2>نوع الشكوى (يمكن اختيار أكثر من واحدة)</h2><div class="chips">${CP[c.type].map(x=>`<button type="button" class="chip ${c.comps.includes(x)?'on':''}" data-c="${x}">${x}</button>`).join('')}</div>
<label>وصف مختصر</label><textarea data-k="desc">${esc(c.desc)}</textarea>
<div class="g2" style="margin-top:10px"><div><label>صورة منتج العميل</label><div class="up" data-i="img1">${c.img1?`<img src="${imgSrc(c.img1)}">`:'اضغط لرفع صورة'}</div></div><div><label>صورة المنتج المرجعي (اختياري)</label><div class="up" data-i="img2">${c.img2?`<img src="${imgSrc(c.img2)}">`:'اضغط لرفع صورة'}</div></div></div><input type="file" id="file" accept="image/*" hidden></div>
${adm?`<div class="card"><h2>الفحص وقرار المستشار العطري</h2><label>نتيجة الفحص</label><textarea data-k="finding">${esc(c.finding)}</textarea>
<label>القرار</label><div class="chips">${Object.entries(DEC).map(([k,v])=>`<button type="button" class="chip ${c.dec===k?'on':''}" data-d="${k}">${v}</button>`).join('')}</div>
<label>سبب القرار</label><input data-k="reason" value="${esc(c.reason)}"><div class="g2"><div><label>الإجراء المنفذ</label><select data-k="done">${['','لم يتم الاستبدال بعد','تم الاستبدال','لا ينطبق'].map(o=>`<option ${c.done===o?'selected':''}>${o}</option>`).join('')}</select></div><div><label>اسم المستشار العطري</label><input data-k="cons" value="${esc(c.cons)}"></div></div>
<label>تاريخ القرار</label><input type="date" data-k="decDate" value="${String(c.decDate).slice(0,10)}"></div>`:''}
<p id="msg" class="err"></p><div class="row"><button class="btn" id="sv">${c.no?'حفظ التعديلات':'إرسال البلاغ'}</button>${adm?'<button class="btn s" id="pdf">حفظ وإصدار PDF</button>':''}</div>`}
function bind(){
document.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>cur[e.dataset.k]=e.value);
document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{cur.type=e.dataset.t;cur.comps=[];draw()});
document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{const x=e.dataset.c,a=cur.comps;a.includes(x)?a.splice(a.indexOf(x),1):a.push(x);e.classList.toggle('on')});
document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{cur.dec=e.dataset.d;if(cur.dec!=='pending'&&!cur.decDate)cur.decDate=today();draw()});
const bs=$('#bs'),bl=$('#bl');
bs.oninput=()=>{cur.bc=cur.bn='';const k=norm(bs.value);const m=k?BR.filter(b=>norm(b[0]+b[1]).includes(k)).slice(0,8):[];bl.innerHTML=m.map(b=>`<div data-c="${b[0]}">${b[0]} · ${esc(b[1])}</div>`).join('');bl.style.display=m.length?'block':'none'};
bs.onfocus=()=>{if(!cur.bn)bs.oninput()};
bl.onmousedown=e=>{const b=BR.find(x=>x[0]===e.target.dataset.c);if(b){cur.bc=b[0];cur.bn=b[1];bs.value=b[0]+' · '+b[1];bl.style.display='none'}};
bs.onblur=()=>setTimeout(()=>bl.style.display='none',150);
let tgt;document.querySelectorAll('.up').forEach(e=>e.onclick=()=>{tgt=e.dataset.i;$('#file').click()});
$('#file').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cur[tgt]=cv.toDataURL('image/jpeg',.72);ev.target.value='';draw()};im.src=URL.createObjectURL(f)};
$('#sv').onclick=async()=>{if(await commit())ROLE==='admin'?(alert('تم الحفظ: '+cur.no),ALL=null):go('done')};
const p=$('#pdf');if(p)p.onclick=async()=>{if(await commit()){ALL=null;printRep(cur)}}}
async function commit(){const m=$('#msg');m.textContent='';
if(!cur.bn){m.textContent='اختر الفرع من القائمة';return false}if(!cur.name.trim()){m.textContent='اكتب اسم العميل';return false}
const bs=document.querySelectorAll('.btn');bs.forEach(b=>b.disabled=true);
try{const upd=!!cur.no,r=await api(upd?{action:'update',no:cur.no,data:cur}:{action:'submit',data:cur});
if(!r.ok){m.textContent=r.err==='auth'?'انتهت الجلسة، سجّل الدخول من جديد':'تعذر الحفظ: '+r.err;bs.forEach(b=>b.disabled=false);return false}
if(!upd)cur.no=r.no;cur.img1=r.img1||cur.img1;cur.img2=r.img2||cur.img2;bs.forEach(b=>b.disabled=false);return true}
catch(e){m.textContent='تعذر الاتصال بالخادم، لم يُحفظ البلاغ. تحقق من الإنترنت وأعد المحاولة.';bs.forEach(b=>b.disabled=false);return false}}
async function loadAll(){if(ALL){paint();return}const box=$('#dyn');if(box)box.innerHTML='<div class="card">جارٍ التحميل...</div>';
try{const r=await api({action:'list'});if(!r.ok)throw r.err;ALL=r.items.map(i=>({...i,comps:i.comps?String(i.comps).split(' | '):[]}));paint()}catch(e){if(box)box.innerHTML='<div class="card err">تعذر تحميل البيانات: '+esc(e)+'</div>'}}
function paint(){const b=$('#dyn');if(!b)return;b.innerHTML=view==='log'?logList():statsBody()}
function log(){return`<div class="row" style="margin:0 0 12px"><input id="q" placeholder="ابحث بالاسم أو الجوال أو رقم التقرير أو المنتج أو الفرع" value="${esc(q)}"><button class="btn s" style="width:auto" onclick="ALL=null;loadAll()">تحديث</button></div><div id="dyn"></div>`}
function logList(){const k=norm(q),L=ALL.filter(i=>!k||norm([i.name,i.phone,i.no,i.product,i.bn,i.bc].join(' ')).includes(k));
return L.length?L.slice(0,100).map(i=>`<div class="card"><div class="it"><div><b>${esc(i.name)}</b> <span class="tag">${i.no}</span><br><small>${esc(i.bn)} · ${esc(i.product)||'—'} · ${i.type} · ${fd(i.recv)}</small><br><small>${esc(i.comps.join('، '))}</small></div><div><b class="${i.dec}">${DEC[i.dec]||''}</b><br><small>${i.status}</small></div></div><div class="row"><button class="btn s" onclick="ed('${i.no}')">فتح وتعديل</button><button class="btn s" onclick="pr('${i.no}')">تقرير PDF</button><button class="btn s" onclick="del('${i.no}')">حذف</button></div></div>`).join('')+(L.length>100?'<p>يُعرض أول 100 نتيجة، استخدم البحث للتضييق.</p>':''):'<div class="card">لا توجد بلاغات مطابقة.</div>'}
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;if(ALL)paint()}});
const ed=n=>{cur=JSON.parse(JSON.stringify(ALL.find(i=>i.no===n)));go('form')},pr=n=>printRep(ALL.find(i=>i.no===n)),del=async n=>{if(!confirm('حذف هذا البلاغ نهائيًا؟'))return;const r=await api({action:'delete',no:n});if(r.ok){ALL=ALL.filter(i=>i.no!==n);paint()}else alert('تعذر الحذف')};
function stats(){return'<div id="dyn"></div>'}
function statsBody(){const a=ALL,n=a.length,yes=a.filter(i=>i.dec==='yes').length,dn=a.filter(i=>i.done==='تم الاستبدال').length,dec=a.filter(i=>i.dec!=='pending').length;
const cnt=f=>{const c={};a.forEach(i=>f(i).forEach(p=>{p=(p||'غير محدد').trim();c[p]=(c[p]||0)+1}));return Object.entries(c).sort((x,y)=>y[1]-x[1])};
const bars=(l,t)=>l.length?l.map(([p,c])=>`<div class="it"><span>${esc(p)}</span><b>${c}</b></div><div class="bar"><i style="width:${c/l[0][1]*100}%"></i></div>`).join(''):'لا توجد بيانات بعد.';
return`<div class="card st"><div><b>${n}</b>إجمالي الشكاوى</div><div><b>${n-dec}</b>قيد الفحص</div><div><b>${dec?Math.round(yes/dec*100):0}%</b>نسبة الموافقة على الاستبدال</div><div><b>${dn}</b>استبدالات منفذة</div></div>
<div class="card"><h2>الفروع الأكثر شكاوى</h2>${bars(cnt(i=>[i.bn?i.bc+' · '+i.bn:'']).slice(0,10))}</div>
<div class="card"><h2>أكثر المنتجات تكرارًا</h2>${bars(cnt(i=>[i.product]).slice(0,8))}</div>
<div class="card"><h2>أنواع الشكاوى</h2>${bars(cnt(i=>i.comps))}</div>
<div class="card"><h2>عطور مقابل زيوت</h2>${bars(cnt(i=>[i.type]))}</div>`}
function printRep(i){const L=document.querySelector('header img').src;
$('#report').innerHTML=`<div class="rh"><img src="${L}"><div><b>AROMATIC | أروماتك</b><b style="font-size:17px">تقرير فحص شكوى عميل</b><small>AFTER-SALES SERVICE REPORT</small></div></div>
<div class="rm"><span>رقم التقرير: ${i.no}</span><span>تاريخ التقرير: ${fd(today())}</span></div>
<div class="rs"><h3>بيانات العميل والمنتج</h3><div class="rg"><div><span>الفرع</span>${esc(i.bn)?esc(i.bc+' · '+i.bn):'—'}</div><div><span>حالة الشكوى</span>${status(i)}</div><div><span>اسم العميل</span>${esc(i.name)||'—'}</div><div><span>رقم الجوال</span>${esc(i.phone)||'—'}</div><div><span>المنتج (${i.type})</span>${esc(i.product)||'—'}</div><div><span>تاريخ الشراء</span>${fd(i.buy)}</div><div><span>تاريخ استلام المنتج للفحص</span>${fd(i.recv)}</div></div></div>
<div class="rs"><h3>تفاصيل الشكوى</h3><div class="rg"><div style="grid-column:1/3"><span>نوع الشكوى</span>${esc(i.comps.join('، '))||'—'}</div><div style="grid-column:1/3"><span>وصف شكوى العميل</span>${esc(i.desc)||'—'}</div></div>
<div class="ri"><div>${i.img1?`<img src="${imgSrc(i.img1)}">`:'صورة المنتج محل الشكوى'}</div><div>${i.img2?`<img src="${imgSrc(i.img2)}">`:'صورة المنتج المرجعي'}</div></div></div>
<div class="rs"><h3>نتيجة الفحص والقرار</h3><div class="rg"><div style="grid-column:1/3"><span>ملاحظات المستشار العطري</span>${esc(i.finding)||'—'}</div><div><span>قرار الاستبدال</span><b>${DEC[i.dec]||'—'}</b></div><div><span>سبب القرار</span>${esc(i.reason)||'—'}</div><div><span>الإجراء المنفذ</span>${esc(i.done)||'—'}</div><div><span>المستشار العطري</span>${esc(i.cons)||'—'}</div><div><span>تاريخ القرار</span>${fd(i.decDate)}</div></div></div>
<div class="rf">وثيقة داخلية لخدمة ما بعد البيع — أروماتك</div>`;
const im=[...document.querySelectorAll('#report img')].filter(x=>!x.complete);Promise.all(im.map(x=>new Promise(r=>{x.onload=x.onerror=r}))).then(()=>setTimeout(()=>window.print(),150))}
boot();
</script></body></html>
